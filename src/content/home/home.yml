seo_title: Voidless Tale
description: Official site and devlog for Voidless Tale.
panels:
  - type: content
    eyebrow: ''
    title: About Voidless Tale
    text: Voidless Tale is a dark fantasy 2D action RPG where every monster matters. Hunt creatures for their materials OR absorb their abilities(Unique mechanik), and forge your own legendary builds.
  - type: cta
    eyebrow: ''
    title: Follow Development
    text: Track progress through regular devlog updates and milestone posts.
    tags:
      - Pixel RPG
      - Godot
