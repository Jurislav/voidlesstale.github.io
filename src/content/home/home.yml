      - label: Read the devlog
        href: /devlog/
        variant: primary
      - label: About the project
        href: /about/
        variant: ghost
  - type: features
    eyebrow: What is included
    title: Core strengths
    columns: 3
    cards:
      - title: Story about sins!
        text: Voidless Tale is Inspired by the Seven Deadly Sins and Dante Alighieri's Divine Comedy, Voidless Tale follows a soul awakening in Limbo with no memory of its past. Explore a dark fantasy world, uncover forgotten memories, confront the embodiment of each deadly sin, and shape your own fate.
      - title: Every Monster Matters!
        text: Defeat monsters and choose your reward. Absorb powerful skills to expand your build, or loot valuable materials and equipment for crafting and upgrades.
      - title: Forge Your Own Build
        text: Customize your weapons with Veinshards, elements, and unique effects. Experiment with countless combinations to create a legendary build that is uniquely yours.
