# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: Jurislav/voidlesstale.github.io
  branch: main
  base_url: https://sveltia-cms-auth.voidlesstale.workers.dev

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site
    label: Site Content
    files:
      - name: settings
        label: Site Settings
        file: src/content/settings/settings.yml
        fields:
          - { label: Site Title, name: site_title, widget: string }
          - { label: Site Tagline, name: site_tagline, widget: string }
          - { label: Footer Text, name: footer_text, widget: text }
          - label: Navigation
            name: navigation
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Direct Link, name: href, widget: string, required: false }
              - label: Linked Page
                name: page
                widget: relation
                collection: pages
                search_fields: [title, navLabel]
                value_field: "{{slug}}"
                display_fields: [title]
                required: false
          - label: Design
            name: design
            widget: object
            fields:
              - { label: Accent Color, name: accent, widget: color }
              - { label: Secondary Accent, name: accent_soft, widget: color }
              - { label: Text Color, name: text, widget: color }
              - { label: Muted Text Color, name: muted, widget: color }
              - { label: Page Background Start, name: page_bg_start, widget: color }
              - { label: Page Background End, name: page_bg_end, widget: color }
              - { label: Panel Background, name: panel_bg, widget: string }
              - { label: Strong Panel Background, name: panel_strong_bg, widget: string }
              - { label: Border Color, name: border, widget: string }
              - { label: Left Glow Color, name: glow_left, widget: string }
              - { label: Right Glow Color, name: glow_right, widget: string }
              - { label: Max Width, name: max_width, widget: string }
              - { label: Card Radius, name: card_radius, widget: string }
              - { label: Card Padding, name: card_padding, widget: string }
              - { label: Panel Padding, name: panel_padding, widget: string }
      - name: home
        label: Homepage
        file: src/content/home/home.yml
        fields:
          - { label: SEO Title, name: seo_title, widget: string }
          - { label: Description, name: description, widget: text }
          - label: Homepage Panels
            label_singular: Panel
            name: panels
            widget: list
            summary: auto
            allow_add: true
            allow_remove: true
            allow_duplicate: true
            allow_reorder: true
            hint: Add panels, then use the reorder handle to control their order on the homepage.
            types:
              - name: hero
                label: Hero Panel
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string, required: false }
                  - { label: Headline, name: title, widget: string }
                  - { label: Intro, name: text, widget: text }
                  - label: Tags
                    name: tags
                    widget: list
                    required: false
                    field: { label: Tag, name: tag, widget: string }
                  - label: Buttons
                    name: buttons
                    widget: list
                    required: false
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: href, widget: string }
                      - { label: Style, name: variant, widget: select, default: primary, options: [primary, ghost] }
              - name: content
                label: Content Panel
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string, required: false }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - label: Tags
                    name: tags
                    widget: list
                    required: false
                    field: { label: Tag, name: tag, widget: string }
                  - label: Buttons
                    name: buttons
                    widget: list
                    required: false
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: href, widget: string }
                      - { label: Style, name: variant, widget: select, default: primary, options: [primary, ghost] }
              - name: features
                label: Feature Cards
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string, required: false }
                  - { label: Title, name: title, widget: string, required: false }
                  - { label: Columns, name: columns, widget: number, value_type: int, min: 1, max: 4, default: 3 }
                  - label: Cards
                    label_singular: Card
                    name: cards
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: Title, name: title, widget: string }
                      - { label: Text, name: text, widget: text }
              - name: media
                label: Media Panel
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Image, name: image, widget: image, required: false }
                  - { label: Alternative Text, name: alt, widget: string, required: false }
                  - { label: Placeholder Label, name: label, widget: string, required: false }
              - name: devlog
                label: Latest Devlog Panel
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string, required: false }
                  - { label: Title, name: title, widget: string }
                  - { label: Number of Posts, name: post_count, widget: number, value_type: int, min: 1, max: 12, default: 3 }
                  - { label: Columns, name: columns, widget: number, value_type: int, min: 1, max: 4, default: 2 }
              - name: cta
                label: CTA Panel
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string, required: false }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - label: Tags
                    name: tags
                    widget: list
                    required: false
                    field: { label: Tag, name: tag, widget: string }
                  - label: Buttons
                    label_singular: Button
                    name: buttons
                    widget: list
                    required: false
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: href, widget: string }
                      - { label: Style, name: variant, widget: select, default: primary, options: [primary, ghost] }
      - name: smith
        label: Voidless Smith
        file: src/content/site/smith.yml
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Primary CTA Label, name: primary_cta_label, widget: string }
          - { label: Primary CTA Link, name: primary_cta_href, widget: string }
          - { label: Media Label, name: media_label, widget: string }
          - label: Feature Cards
            name: feature_cards
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }

  - name: smith_sidebar
    label: Voidless Smith Sidebar Panels
    label_singular: Sidebar Panel
    folder: src/content/smith-sidebar
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Order, name: order, widget: number, value_type: int, default: 0 }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Navigation Label, name: navLabel, widget: string, required: false }
      - { label: Eyebrow, name: eyebrow, widget: string, required: false }
      - label: Template
        name: template
        widget: select
        default: default
        options: [default, feature, narrow]
      - { label: Draft, name: draft, widget: boolean, default: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - { label: Body, name: body, widget: markdown }

  - name: devlog
    label: Devlog
    label_singular: Post
    folder: src/content/devlog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Publish Date, name: pubDate, widget: datetime }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - { label: Body, name: body, widget: markdown }
